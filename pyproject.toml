[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "davincitest"
version = "0.1.0"
description = "Excel-configured production test framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "concurrent-log-handler>=0.9.28,<1",
    "kthread==0.2.3",
]

[project.scripts]
davincitest = "davincitest.main:main"

[tool.setuptools.packages.find]
include = ["davincitest", "davincitest.*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
davincitest = ["config1.xlsx"]
